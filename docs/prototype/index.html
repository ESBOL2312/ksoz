<title>Сөздік SRS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — header stats, one big flashcard, four grade buttons pinned under it */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --fg:#14232c; --muted:#5d7380;
  --sky:#0f8fb8; --gold:#c9961a; --line:#dbe4ea;
  --again:#c8473b; --hard:#b9822a; --good:#2f8a5b; --easy:#0f8fb8;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e171d; --surface:#16232b; --fg:#e7eff3; --muted:#8ea4b0;
  --sky:#3fb6dc; --gold:#e2b440; --line:#25363f;
  --again:#e2675b; --hard:#d9a14a; --good:#4fb57f; --easy:#3fb6dc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171d; --surface:#16232b; --fg:#e7eff3; --muted:#8ea4b0;
  --sky:#3fb6dc; --gold:#e2b440; --line:#25363f;
  --again:#e2675b; --hard:#d9a14a; --good:#4fb57f; --easy:#3fb6dc; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:440px;margin:0 auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:16px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-family:var(--display);font-size:18px;font-weight:700;margin:0;letter-spacing:.01em}
h1 span{color:var(--gold)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font:500 13px var(--body);padding:6px 10px;border-radius:7px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--sky);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-bottom:2px solid var(--line)}
.stat b{font:600 22px var(--body);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stat.due{border-color:var(--sky)} .stat.new{border-color:var(--gold)}
.card{flex:1;min-height:300px;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 20px;text-align:center;cursor:pointer;position:relative;
  background-image:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--gold) 9%,transparent),transparent 60%)}
.card:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.tag{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag.isnew{color:var(--gold)}
.word{font-family:var(--display);font-weight:500;font-size:clamp(30px,9vw,42px);line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:13px}
.answer{font-size:22px;font-weight:600;color:var(--sky)}
.example{color:var(--muted);font-size:14px;max-width:32ch;line-height:1.45}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:0;border-radius:12px;padding:12px 4px;font:600 14px var(--body);color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.grades button small{font-weight:400;font-size:11px;opacity:.85}
.grades button:focus-visible,.primary:focus-visible,.tabs button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.g-again{background:var(--again)}.g-hard{background:var(--hard)}.g-good{background:var(--good)}.g-easy{background:var(--easy)}
.primary{border:0;border-radius:12px;padding:14px;font:600 15px var(--body);background:var(--sky);color:#fff;cursor:pointer;width:100%}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:40px 12px}
.done .big{font-family:var(--display);font-size:26px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:center}
.row .kk{font-weight:600}.row .ru{color:var(--muted);min-width:0}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.learned{border-color:var(--good);color:var(--good)}
.note{color:var(--muted);font-size:12px;text-align:center}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:active{transform:scale(.985)}}
</style>

<div class="app">
  <header>
    <h1>Сөздік<span>.</span></h1>
    <div class="tabs" role="group" aria-label="Раздел">
      <button id="tab-learn" aria-pressed="true">Учить</button>
      <button id="tab-words" aria-pressed="false">Слова</button>
    </div>
  </header>
  <div class="stats">
    <div class="stat due"><b id="s-due">0</b><small>к повтору</small></div>
    <div class="stat new"><b id="s-new">0</b><small>новых сегодня</small></div>
    <div class="stat"><b id="s-learned">0</b><small>выучено</small></div>
  </div>
  <main id="view"></main>
  <p class="note">Прототип: прогресс хранится в этом браузере. Алгоритм SM-2.</p>
</div>

<script>
const WORDS = [
 ["Сәлем","привет","Сәлем, қалың қалай? — Привет, как дела?"],
 ["Рақмет","спасибо","Көп рақмет! — Большое спасибо!"],
 ["Кешіріңіз","извините",""],
 ["Сау болыңыз","до свидания",""],
 ["Иә","да",""],["Жоқ","нет",""],
 ["Су","вода","Су ішкім келеді. — Я хочу пить воду."],
 ["Нан","хлеб",""],["Ет","мясо",""],["Сүт","молоко",""],["Шай","чай","Шай ішесіз бе? — Будете чай?"],["Алма","яблоко",""],
 ["Үй","дом","Менің үйім — Мой дом"],["Мектеп","школа",""],["Қала","город",""],["Ауыл","аул, село",""],["Көше","улица",""],
 ["Ана","мама",""],["Әке","отец",""],["Бала","ребёнок",""],["Дос","друг","Ол менің досым. — Он мой друг."],
 ["Кітап","книга",""],["Жұмыс","работа",""],["Ақша","деньги",""],["Тіл","язык",""],
 ["Күн","день; солнце",""],["Түн","ночь",""],["Ай","луна; месяц",""],["Жыл","год",""],
 ["Ит","собака",""],["Мысық","кошка",""],["Жылқы","лошадь",""],["Қой","овца",""],
 ["Үлкен","большой",""],["Кішкентай","маленький",""],["Жақсы","хорошо; хороший","Бәрі жақсы. — Всё хорошо."],["Жаман","плохо; плохой",""],["Әдемі","красивый",""],
 ["Ақ","белый",""],["Қара","чёрный",""],["Қызыл","красный",""],["Көк","синий, голубой",""],
 ["Бір","один",""],["Екі","два",""],["Үш","три",""],
 ["Бару","идти, ехать (туда)",""],["Келу","приходить",""],["Жеу","есть, кушать",""],["Ішу","пить",""],["Сөйлеу","говорить",""],["Білу","знать",""],
 ["Махаббат","любовь",""]
];
const NEW_PER_DAY = 10, KEY = "kz-srs-v1";
const today = () => { const d = new Date(); return Math.floor((d - d.getTimezoneOffset()*60000) / 86400000); };

// Telegram WebApp integration (no-op outside Telegram)
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();

let S;
function load(){ try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch { S = null; }
  S ||= { cards:{}, newDay:0, newCount:0 }; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

// SM-2: q = 0 (снова), 3 (трудно), 4 (хорошо), 5 (легко)
function schedule(c, q){
  const n = { ...c };
  if (q < 3){ n.reps = 0; n.interval = 0; }
  else {
    n.interval = n.reps === 0 ? (q === 5 ? 3 : 1) : n.reps === 1 ? (q === 3 ? 3 : 6) : Math.round(n.interval * n.ef * (q === 3 ? 0.8 : q === 5 ? 1.3 : 1));
    n.reps++;
  }
  n.ef = Math.max(1.3, n.ef + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
  n.due = today() + n.interval;
  return n;
}
const fresh = () => ({ reps:0, interval:0, ef:2.5, due:today() });
const fmt = d => d === 0 ? "<10 мин" : d === 1 ? "1 д" : d < 30 ? d + " д" : Math.round(d/30) + " мес";

let queue = [], current = null, flipped = false, tab = "learn";
function buildQueue(){
  if (S.newDay !== today()){ S.newDay = today(); S.newCount = 0; }
  const due = WORDS.map((w,i)=>i).filter(i => S.cards[i] && S.cards[i].due <= today());
  const fresh_ = WORDS.map((w,i)=>i).filter(i => !S.cards[i]).slice(0, Math.max(0, NEW_PER_DAY - S.newCount));
  queue = [...due.sort(()=>Math.random()-.5), ...fresh_];
}
function stats(){
  const t = today(), ids = Object.keys(S.cards);
  document.getElementById("s-due").textContent = queue.filter(i => S.cards[i]).length;
  document.getElementById("s-new").textContent = queue.filter(i => !S.cards[i]).length;
  document.getElementById("s-learned").textContent = ids.filter(i => S.cards[i].interval >= 21 || S.cards[i].reps >= 3).length;
}
function render(){
  stats();
  const v = document.getElementById("view");
  if (tab === "words") return renderWords(v);
  current = queue[0];
  if (current === undefined){
    v.innerHTML = `<div class="done"><div class="big">Бәрі жақсы!</div><p class="hint">На сегодня всё. Новые карточки появятся завтра.</p></div>`;
    tg?.MainButton?.hide(); return;
  }
  const [kk, ru, ex] = WORDS[current], c = S.cards[current] || fresh(), isNew = !S.cards[current];
  v.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px;height:100%">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Показать перевод">
      <span class="tag ${isNew?"isnew":""}">${isNew?"Новое слово":"Повторение"}</span>
      <div class="word" lang="kk">${kk}</div>
      ${flipped ? `<div class="answer">${ru}</div>${ex?`<div class="example">${ex}</div>`:""}` : `<div class="hint">Нажмите, чтобы увидеть перевод</div>`}
    </div>
    ${flipped ? `<div class="grades">
      ${[[0,"again","Снова"],[3,"hard","Трудно"],[4,"good","Хорошо"],[5,"easy","Легко"]].map(([q,k,l]) =>
        `<button class="g-${k}" data-q="${q}">${l}<small>${fmt(schedule(c,q).interval)}</small></button>`).join("")}
    </div>` : `<button class="primary" id="show">Показать</button>`}
  </div>`;
  const flip = () => { flipped = true; tg?.HapticFeedback?.impactOccurred("light"); render(); };
  if (!flipped){ document.getElementById("card").onclick = flip; document.getElementById("show").onclick = flip; }
  v.querySelectorAll("[data-q]").forEach(b => b.onclick = () => grade(+b.dataset.q));
}
function grade(q){
  const isNew = !S.cards[current];
  S.cards[current] = schedule(S.cards[current] || fresh(), q);
  if (isNew) S.newCount++;
  queue.shift();
  if (q === 0) queue.splice(Math.min(3, queue.length), 0, current); // вернуть в эту же сессию
  tg?.HapticFeedback?.notificationOccurred(q === 0 ? "warning" : "success");
  flipped = false; save(); render();
}
function renderWords(v){
  v.innerHTML = `<div class="list">${WORDS.map(([kk,ru],i) => { const c = S.cards[i];
    const st = !c ? `<span class="pill">новое</span>` : `<span class="pill ${c.reps>=3?"learned":""}">через ${fmt(Math.max(0,c.due-today()))}</span>`;
    return `<div class="row"><span class="kk" lang="kk">${kk}</span><span class="ru">${ru}</span>${st}</div>`; }).join("")}</div>`;
}
document.addEventListener("keydown", e => {
  if (tab !== "learn" || current === undefined) return;
  if (!flipped && (e.key === " " || e.key === "Enter")){ e.preventDefault(); flipped = true; render(); }
  else if (flipped && "1234".includes(e.key)) grade([0,3,4,5][+e.key-1]);
});
for (const t of ["learn","words"]) document.getElementById("tab-"+t).onclick = () => {
  tab = t; document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", b.id === "tab-"+t)); render(); };
load(); buildQueue(); render();
</script>
